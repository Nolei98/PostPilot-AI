<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - PostPilot AI (v1.4)</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <!-- ========== STARFIELD ========== -->
  <div class="starfield"></div>

  <!-- ========== MOBILE SIDEBAR TOGGLE ========== -->
  <button class="sidebar-toggle" id="sidebar-toggle-btn" aria-label="Abrir menu">☰</button>

  <!-- ================================================================
       AUTH WRAPPER
       ================================================================ -->
  <div class="auth-wrapper" id="auth-wrapper">
    <div class="glass-panel auth-card">

      <!-- Brand Side -->
      <div class="auth-brand-side">
        <div class="orb-3d">
          <div class="orb-inner-glow"></div>
        </div>
        <div class="auth-brand-title">PostPilot<span>/AI</span></div>
        <p class="auth-brand-sub">Automatize suas redes sociais com inteligência artificial. Conteúdo relevante, sempre pronto.</p>
      </div>

      <!-- Form Side -->
      <div class="auth-form-side">
        <h3 id="auth-title">ENTRAR</h3>

        <form id="auth-form" autocomplete="off">
          <div class="form-group">
            <label class="form-label" for="auth-email">E-mail</label>
            <input class="form-input" type="email" id="auth-email" placeholder="seu@email.com" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="auth-password">Senha</label>
            <input class="form-input" type="password" id="auth-password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn btn-gradient" id="auth-submit-btn" style="width:100%;margin-top:8px;">Entrar</button>
        </form>

        <p id="auth-toggle-text" style="font-size:.8rem;color:var(--text-muted);margin-top:20px;text-align:center;">
          Não tem conta? <a href="#" id="toggle-auth-mode" style="color:var(--accent-magenta);font-weight:600;">Criar conta</a>
        </p>
      </div>

    </div>
  </div>

  <!-- ================================================================
       APP WRAPPER
       ================================================================ -->
  <div class="app-wrapper" id="app-wrapper" style="display:none;">

    <!-- ==================== SIDEBAR ==================== -->
    <aside class="app-sidebar">

      <!-- Logo -->
      <div class="sidebar-logo">
        <div class="orb-logo"></div>
        <div class="sidebar-logo-text">PostPilot<span>/AI</span></div>
      </div>

      <!-- Navigation -->
      <nav class="app-nav">
        <button class="nav-link active" data-tab="fila">
          <span class="nav-link-icon">📥</span> Fila
        </button>
        <button class="nav-link" data-tab="ready">
          <span class="nav-link-icon">✅</span> Prontos
        </button>
        <button class="nav-link" data-tab="settings">
          <span class="nav-link-icon">⚙️</span> Ajustes
        </button>
        <button class="nav-link" data-tab="billing">
          <span class="nav-link-icon">💳</span> Assinatura
        </button>
      </nav>

      <!-- User Profile Footer -->
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar">JR</div>
          <div class="user-info">
            <div class="user-name">João Rodrigues</div>
            <div class="user-email">joao@postpilot.ai</div>
          </div>
        </div>
        <button class="btn-logout" id="btn-logout">↩ Sair da conta</button>
      </div>

    </aside>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main class="app-content">

      <!-- ---- FILA PANEL ---- -->
      <div class="tab-panel" data-panel="fila">
        <div class="content-header">
          <h2>📥 Fila de Posts</h2>
          <button class="btn-scan" id="btn-scan-rss">⟳ Scan RSS</button>
        </div>
        <div class="posts-grid" id="fila-grid"></div>
      </div>

      <!-- ---- READY PANEL ---- -->
      <div class="tab-panel" data-panel="ready" style="display:none;">
        <div class="content-header">
          <h2>✅ Prontos para Publicar</h2>
        </div>
        <div class="posts-grid" id="ready-grid"></div>
      </div>

      <!-- ---- SETTINGS PANEL ---- -->
      <div class="tab-panel" data-panel="settings" style="display:none;">
        <div class="content-header">
          <h2>⚙️ Ajustes</h2>
        </div>
        <div class="settings-container" id="settings-content"></div>
      </div>

      <!-- ---- BILLING PANEL ---- -->
      <div class="tab-panel" data-panel="billing" style="display:none;">
        <div class="content-header">
          <h2>💳 Assinatura</h2>
        </div>
        <div id="billing-content"></div>
      </div>

    </main>
  </div>

  <!-- ================================================================
       EDIT DRAWER
       ================================================================ -->
  <div class="app-drawer-overlay" id="drawer-overlay"></div>
  <div class="app-drawer" id="edit-drawer">
    <div class="drawer-header">
      <h3>✎ Editar Post</h3>
      <button class="drawer-close-btn" id="drawer-close-btn">✕</button>
    </div>

    <div class="drawer-image-preview">
      <img id="drawer-img" src="" alt="Preview" />
    </div>

    <button class="btn btn-ghost" id="drawer-regen-btn" style="align-self:flex-start;">🔄 Regenerar Imagem</button>

    <label class="form-label" style="margin-top:4px;">Legenda</label>
    <textarea class="textarea-caption" id="drawer-caption" rows="8"></textarea>

    <div style="display:flex;gap:12px;margin-top:auto;padding-top:12px;">
      <button class="btn btn-gradient" id="drawer-save-btn" style="flex:1;">Salvar</button>
      <button class="btn btn-ghost" id="drawer-cancel-btn" onclick="document.getElementById('drawer-close-btn').click()">Cancelar</button>
    </div>
  </div>

  <!-- ========== TOAST ========== -->
  <div class="toast" id="app-toast"></div>

  <!-- ========== JS ========== -->
  <script src="js/app.js"></script>
</body>
</html>
